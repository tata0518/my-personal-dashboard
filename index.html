<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マイダッシュボード</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--sub:#6b7280;--line:#e5e7eb;--pri:#2563eb;--red:#e11d48}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1c212b;--tx:#e8eaf0;--sub:#9aa3b2;--line:#2d3441;--pri:#60a5fa;--red:#fb7185}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-weight:700;font-size:18px}
header button{background:none;border:0;font-size:20px;color:var(--sub)}
main{flex:1;overflow-y:auto;padding:0 12px 90px;position:relative}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0;background:none;border:0;color:var(--sub);font-size:12px}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--pri);font-weight:700}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--line)}
.link{display:block;text-align:center;text-decoration:none;color:var(--pri);font-weight:600;padding:12px}
.row{display:flex;gap:8px;align-items:center}
select,input,textarea,button.btn{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px}
select,input[type=text],input[type=date],textarea{width:100%}
textarea{min-height:90px}
.btn{cursor:pointer}.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.d{color:var(--red)}
.seg{display:flex;margin:8px 0}
.seg button{flex:1;padding:8px;border:1px solid var(--line);background:var(--card);color:var(--sub)}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.next{font-size:15px;margin:6px 0 10px}.next b{font-size:26px}
.tt{display:grid;grid-template-columns:44px 1fr}
.tt>div{padding:8px 4px;border-bottom:1px solid var(--line)}
.tt .h{font-weight:700;color:var(--sub);text-align:center}
.tt .m{display:flex;flex-wrap:wrap;gap:6px}
.tt .m span{min-width:34px;text-align:center;padding:3px 4px;border-radius:50%;border:2px solid transparent;font-variant-numeric:tabular-nums}
.tt .m span.past{color:var(--sub);opacity:.45}
.tt .m span.nx{border-color:var(--red);color:var(--red);font-weight:700}
.empty{color:var(--sub);text-align:center;padding:30px 10px;line-height:1.7}
.todo{display:flex;align-items:center;gap:8px}
.todo .bd{flex:1;min-width:0}
.todo .t{font-weight:600;word-break:break-all}
.todo .meta{font-size:12px;color:var(--sub);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.todo.done .t{text-decoration:line-through;color:var(--sub)}
.todo{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.todo.drag{position:relative;z-index:5;box-shadow:0 8px 20px #0005;opacity:.95;border-color:var(--pri)}
.pri{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;color:#fff;font-size:12px;font-weight:700}
.pA{background:#e11d48}.pB{background:#f59e0b}.pC{background:#64748b}
.over{color:var(--red);font-weight:700}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:16px;color:var(--tx)}
.ic.ok{color:#16a34a}
#fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 4px 12px #0004}
.mask{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:10}
.mask.on{display:flex}
.modal{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 10px}
.modal label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
.modal .acts{display:flex;gap:8px;margin-top:16px}.modal .acts .btn{flex:1}
small{color:var(--sub)}

.route{font-size:14px;color:var(--sub);margin:4px 0 8px}.route b{color:var(--tx)}
.bus{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.bus.past{opacity:.45}
.tm{font-size:20px;font-weight:700;padding:2px 12px;border:2px solid transparent;border-radius:999px}
.tm.nx{border-color:var(--red);color:var(--red);font-size:24px}
.ar{color:var(--sub)}.tm2{font-size:17px}
.cr{font-size:11px;padding:2px 7px;border-radius:10px;color:#fff;white-space:nowrap}
.c1{background:#16a34a}.c2{background:#2563eb}.c3{background:#f59e0b}.c4{background:#e11d48}
.nt{flex:1;font-size:12px;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.busw{border-bottom:1px solid var(--line)}.busw .bus{border-bottom:0}.busw.past{opacity:.45}
.xf{font-size:12px;color:var(--sub);padding:0 4px 9px 16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.xf b{color:var(--tx)}.xf .btn{padding:3px 10px;font-size:12px;margin-left:auto}
.xfr{font-size:13px;padding:7px 4px;border-bottom:1px solid var(--line)}
.okm{color:#16a34a;font-weight:700}.ngm{color:var(--red);font-weight:700}
.rb{padding:4px 10px;font-size:12px;flex:none}
input[type=time]{width:100%}
.row input[type=time]{flex:1}
#rDD,#rDA{color:var(--red);font-weight:700;margin-left:8px}
.dist{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.dist .lb{width:7.5em;flex:none}.dist .br{flex:1;height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.dist .br i{display:block;height:100%}.dist .n{width:2em;text-align:right;color:var(--sub)}
[data-rd]{cursor:pointer}
.cmpr{display:grid;gap:4px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.g5{grid-template-columns:1.1fr .9fr 1.2fr 1.5fr 1fr}.g4{grid-template-columns:1.1fr .9fr 1.2fr 1.7fr}
.cmpr.hd{font-size:11px;color:var(--sub);padding:4px 0}
.cmpr span{display:block}.cmpr .cr{display:inline-block}.cmpr small{display:block;font-size:10px}
.cmpr.past{opacity:.45}.cmpr .est{color:var(--sub)}
.best{color:#16a34a;font-weight:700}.best .cr{box-shadow:0 0 0 2px #16a34a}
.pick{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pick .ic2{font-size:22px}.pick b{font-size:12px;color:var(--sub)}.pick .v{font-size:16px;font-weight:700}.pick .v small{font-weight:400;font-size:12px}
body[data-tab=cmp] #fab{display:none}
</style>
</head>
<body>
<header><span id="ttl">🚌 バス時刻表</span><button id="gear">⚙️</button></header>
<main>
 <section class="tab on" id="tab-bus">
  <div class="card"><a class="link" target="_blank" rel="noopener" href="https://www.kotsu.metro.tokyo.jp/bus/unkou/">🔗 都営バス 運行情報を見る</a></div>
  <div class="card">
   <div class="seg" id="legSeg"><button data-l="o1">行き①</button><button data-l="o2">行き②</button><button data-l="r1">帰り①</button><button data-l="r2">帰り②</button></div>
   <div id="busBody"></div>
  </div>
 </section>
 <section class="tab" id="tab-cmp">
  <div class="card">
   <div class="seg" id="cmpSeg"><button data-l="o1">行き①</button><button data-l="o2">行き②</button><button data-l="r1">帰り①</button><button data-l="r2">帰り②</button></div>
   <label class="row" style="justify-content:flex-end"><input type="checkbox" id="cmpUp" checked><small>これから乗れる便のみ</small></label>
   <div id="cmpBody"></div>
  </div>
 </section>
 <section class="tab" id="tab-todo">
  <div id="todoList"></div>
  <div class="row" style="justify-content:center;gap:16px"><label class="row"><input type="checkbox" id="showDone"><small>完了済みも表示</small></label><button class="btn" id="sortBtn"><small>期限順に並べ替え</small></button></div><div style="text-align:center"><small>カードを長押しして上下にドラッグで並べ替え</small></div>
 </section>
</main>
<button id="fab">＋</button>
<nav>
 <button data-t="bus" class="on"><span>🚌</span>バス</button>
 <button data-t="cmp"><span>📊</span>比較</button>
 <button data-t="todo"><span>✅</span>やること</button>
</nav>

<!-- 便モーダル -->
<div class="mask" id="mBus"><div class="modal">
 <h3 id="mBusT">便の登録</h3>
 <label id="bDepL">発車時刻</label><input type="time" id="bDep">
 <label id="bArrL">到着時刻</label><input type="time" id="bArr">
 <label>混雑予想</label><select id="bCrowd"><option value="0">未設定</option><option value="1">空いている</option><option value="2">ふつう</option><option value="3">混雑</option><option value="4">激混み</option></select>
 <label>備考</label><input type="text" id="bNote">
 <div class="acts"><button class="btn d" id="bDel">削除</button><button class="btn" data-close>キャンセル</button><button class="btn p" id="bSave">保存</button></div>
 <div class="acts" id="bAgainRow"><button class="btn" id="bSave2">保存して続けて登録</button></div>
</div></div>

<!-- 記録モーダル -->
<div class="mask" id="mRec"><div class="modal">
 <h3 id="rT">記録</h3>
 <small>入力できる項目だけでOK。同じ日に何度でも追記できます。</small>
 <label>日付</label><input type="date" id="rDate">
 <label>実際の発車時刻<span id="rDD"></span></label>
 <div class="row"><input type="time" id="rAD"><button class="btn" data-now="rAD">今</button></div>
 <label>実際の到着時刻<span id="rDA"></span></label>
 <div class="row"><input type="time" id="rAA"><button class="btn" data-now="rAA">今</button></div>
 <label>混雑状況</label>
 <select id="rCr"><option value="0">未記録</option><option value="1">空いている</option><option value="2">ふつう</option><option value="3">混雑</option><option value="4">激混み</option></select>
 <div id="rXBox">
  <label>乗り換え先の便</label><select id="rXB"></select>
  <label>乗り換えの結果</label>
  <select id="rXR"><option value="0">未記録</option><option value="1">スムーズに成功</option><option value="2">少し待ったが成功</option><option value="3">待ち時間が短く失敗</option><option value="4">待ち時間が長すぎて失敗</option></select>
 </div>
 <div class="acts"><button class="btn d" id="rDel">削除</button><button class="btn" data-close>キャンセル</button><button class="btn p" id="rSave">保存</button></div>
</div></div>

<!-- 便の詳細モーダル -->
<div class="mask" id="mDet"><div class="modal">
 <h3 id="dT"></h3><div id="dBody"></div>
 <div class="acts"><button class="btn" id="dEdit">便を編集</button><button class="btn p" id="dRec">記録する</button></div>
 <div class="acts"><button class="btn" data-close>閉じる</button></div>
</div></div>

<!-- やること モーダル -->
<div class="mask" id="mTodo"><div class="modal">
 <h3 id="mTodoT">新規タスク</h3>
 <label>タイトル</label><input type="text" id="tTitle">
 <label>重要度</label>
 <div class="seg" id="priSeg"><button data-p="A">A</button><button data-p="B">B</button><button data-p="C">C</button></div>
 <label>カテゴリー（選択 or 新規入力）</label><input type="text" id="tCat" list="catList"><datalist id="catList"></datalist>
 <label>内容</label><textarea id="tBody"></textarea>
 <label>期限</label>
 <div class="row"><input type="date" id="tDue"><label class="row" style="margin:0;white-space:nowrap"><input type="checkbox" id="tNoDue" checked> 期限なし</label></div>
 <div class="acts"><button class="btn d" id="tDel">削除</button><button class="btn" data-close>キャンセル</button><button class="btn p" id="tSave">保存</button></div>
</div></div>

<!-- 設定モーダル -->
<div class="mask" id="mSet"><div class="modal">
 <h3>⚙️ Googleスプレッドシート同期</h3>
 <small>Apps ScriptのウェブアプリURLを入れると、変更のたびに自動保存し、起動時に読み込みます。空欄ならこの端末内（localStorage）のみ。</small>
 <label>Apps Script URL</label><input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec">
 <label>乗り換え所要時間（分）</label><input type="text" inputmode="numeric" id="xfMin">
 <div id="syncMsg"><small></small></div>
 <div class="acts"><button class="btn" id="pull">読込</button><button class="btn" id="push">送信</button><button class="btn p" id="setSave">保存</button></div>
 <div class="acts"><button class="btn" data-close>閉じる</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const KEY='myDash.v1', URLKEY='myDash.gas';
let S={buses:[],xfers:[],recs:[],todos:[]}, ui={day:null,pri:'B',editStop:null,editTodo:null};

/* ---------- 保存・同期 ---------- */
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
const gas=()=>{try{return localStorage.getItem(URLKEY)||''}catch(e){return ''}};
let tmr;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(tmr); if(gas()) tmr=setTimeout(push,800);
}
async function push(){
  if(!gas()) return msg('URL未設定');
  try{await fetch(gas(),{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(S)});msg('送信しました '+new Date().toLocaleTimeString())}
  catch(e){msg('送信失敗: '+e.message)}
}
async function pull(){
  if(!gas()) return msg('URL未設定');
  try{const r=await fetch(gas()); const d=await r.json();
    if(d&&(d.stops||d.todos)){S=Object.assign({buses:[],xfers:[],recs:[],todos:[]},d);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}renderAll();msg('読み込みました')}
    else msg('シートにデータがありません');
  }catch(e){msg('読込失敗: '+e.message)}
}
const msg=t=>$('#syncMsg').innerHTML='<small>'+esc(t)+'</small>';

/* ---------- 共通UI ---------- */
const open=id=>$(id).classList.add('on'), close=()=>$$('.mask').forEach(m=>m.classList.remove('on'));
$$('[data-close]').forEach(b=>b.onclick=close);
$$('.mask').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)close()}));
$$('nav button').forEach(b=>b.onclick=()=>{
  $$('nav button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.tab').forEach(t=>t.classList.toggle('on',t.id==='tab-'+b.dataset.t));
  document.body.classList.toggle('todo-on',b.dataset.t==='todo');
  $('#ttl').textContent=({bus:'🚌 バス時刻表',cmp:'📊 便の比較',todo:'✅ やることリスト'})[b.dataset.t];document.body.dataset.tab=b.dataset.t;if(b.dataset.t==='cmp')renderCmp();
  if(b.dataset.t==='bus') scrollNext();
});

/* ---------- バス時刻表 ---------- */
const LEGS={o1:{n:'行き①',f:'野方駅南口',t:'王子駅前'},o2:{n:'行き②',f:'王子駅前',t:'堀船'},r1:{n:'帰り①',f:'堀船',t:'王子駅前'},r2:{n:'帰り②',f:'王子駅前',t:'野方駅南口'}};
const CROWD=['','空いている','ふつう','混雑','激混み'];
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?+m[1]*60+ +m[2]:null};
const fT=t=>(t||'').slice(0,5).replace(/^0/,'');
const NEXT={o1:'o2',r1:'r2'};
const XF=()=>(S.xfer===0||S.xfer)?+S.xfer:5;
const CCOL=['','#16a34a','#2563eb','#f59e0b','#e11d48'], XCOL=['','#16a34a','#84cc16','#f59e0b','#e11d48'];
const XRES_S=['','スムーズ成功','少し待って成功','短すぎて失敗','長すぎて失敗'];
const dlt=(a,s)=>(a&&s)?toMin(a)-toMin(s):null;
const sd=d=>d==null?'':(d>0?'+'+d:''+d);
const stat=(a,b)=>{const r=S.recs.filter(x=>x.busId===a&&x.xBusId===b&&x.xRes>0);return r.length?`実績 ○${r.filter(x=>x.xRes<=2).length}/${r.length}`:'実績なし'};
const byDep=l=>l.slice().sort((p,q)=>toMin(p.dep)-toMin(q.dep));
function cand(b){
  const nl=NEXT[b.leg], am=toMin(b.arr); if(!nl||am===null) return null;
  return byDep(S.buses.filter(x=>x.leg===nl)).find(x=>toMin(x.dep)>=am+XF())||false;
}
function renderBus(f=true){
  ui.leg=ui.leg||(new Date().getHours()<12?'o1':'r1');
  $$('#legSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===ui.leg));
  const L=LEGS[ui.leg];
  const list=byDep(S.buses.filter(b=>b.leg===ui.leg));
  const now=new Date(), nm=now.getHours()*60+now.getMinutes();
  const nx=list.find(b=>toMin(b.dep)>=nm);
  let h=`<div class="route"><b>${L.f}</b> → <b>${L.t}</b>　<small>タップで記録の概要</small></div>`;
  if(!list.length) h+='<div class="empty">便が未登録です。<br>右下の「＋」から登録してください。</div>';
  else{
    h+=nx?`<div class="next">次の便 <b>${fT(nx.dep)}</b>　あと${toMin(nx.dep)-nm}分</div>`:'<div class="next">本日の便は終了しました</div>';
    h+=list.map(b=>{
      let xf='';
      if(NEXT[b.leg]&&b.arr){
        const c=cand(b);
        xf=c?`<div class="xf">🔁 <b>${fT(c.dep)}</b>発に接続可（待ち${toMin(c.dep)-toMin(b.arr)}分）　${stat(b.id,c.id)}</div>`
            :`<div class="xf">🔁 乗継可能な便なし（乗換${XF()}分）</div>`;
      }
      return `<div class="busw ${toMin(b.dep)<nm?'past':''}"><div class="bus" data-id="${b.id}"><span class="tm ${nx&&nx.id===b.id?'nx':''}">${fT(b.dep)}</span><span class="ar">→</span><span class="tm2">${fT(b.arr)||'--'}</span>${+b.crowd>0?`<span class="cr c${b.crowd}">${CROWD[b.crowd]}</span>`:''}<span class="nt">${esc(b.note)}</span><button class="btn rb" data-rec="${b.id}">記録</button></div>${xf}</div>`;
    }).join('');
  }
  $('#busBody').innerHTML=h;
  const id=nx?nx.id:null; if(f||ui.lastNx!==id) scrollNext(); ui.lastNx=id;
  renderCmp();
}
function scrollNext(){setTimeout(()=>{const e=$('.tm.nx');if(e&&$('#tab-bus').classList.contains('on'))e.scrollIntoView({block:'center',behavior:'smooth'})},80)}
$('#legSeg').onclick=e=>{const b=e.target.closest('button');if(b){ui.leg=b.dataset.l;renderBus()}};
$('#busBody').onclick=e=>{
  const x=e.target.closest('[data-rec]'); if(x) return openRec(x.dataset.rec);
  const r=e.target.closest('.bus'); if(r) openDet(r.dataset.id);
};

/* 記録 */
const recsOf=id=>S.recs.filter(r=>r.busId===id).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);
const recFind=(id,d)=>S.recs.find(r=>r.busId===id&&r.date===d);
function openRec(id,date,fromDet){
  const b=S.buses.find(x=>x.id===id); if(!b) return;
  ui.recBus=id; ui.reopen=fromDet?id:null;
  $('#rT').textContent=LEGS[b.leg].n+' '+fT(b.dep)+(b.arr?'→'+fT(b.arr):'')+' の記録';
  $('#rDate').value=date||todayStr();
  const nl=NEXT[b.leg]; ui.recX=!!nl; $('#rXBox').style.display=nl?'':'none';
  if(nl){
    const bs=byDep(S.buses.filter(x=>x.leg===nl)), c=cand(b)||bs[0];
    $('#rXB').innerHTML=bs.length?bs.map(x=>`<option value="${x.id}">${LEGS[nl].n} ${fT(x.dep)}発</option>`).join(''):`<option value="">（${LEGS[nl].n}の便が未登録）</option>`;
    if(c) $('#rXB').value=c.id;
  }
  fillRec(); open('#mRec');
}
function fillRec(){
  const r=recFind(ui.recBus,$('#rDate').value)||{};
  $('#rAD').value=r.actDep||''; $('#rAA').value=r.actArr||''; $('#rCr').value=r.crowd||0; $('#rXR').value=r.xRes||0;
  if(r.xBusId) $('#rXB').value=r.xBusId;
  $('#rDel').style.display=r.id?'':'none'; calcRec();
}
function calcRec(){
  const b=S.buses.find(x=>x.id===ui.recBus); if(!b) return;
  const f=(a,s)=>{const d=dlt(a,s);return d===null?'':d>0?'　＋'+d+'分遅れ':d<0?'　'+(-d)+'分早い':'　定刻'};
  $('#rDD').textContent=f($('#rAD').value,b.dep); $('#rDA').textContent=f($('#rAA').value,b.arr);
}
$('#rDate').onchange=fillRec; $('#rAD').oninput=calcRec; $('#rAA').oninput=calcRec;
$('#mRec').addEventListener('click',e=>{
  const n=e.target.closest('[data-now]'); if(!n) return;

function afterRec(){save();close();renderBus(false);if(ui.reopen)openDet(ui.reopen)}
$('#rSave').onclick=()=>{
  const b=S.buses.find(x=>x.id===ui.recBus), date=$('#rDate').value||todayStr();
  const ad=$('#rAD').value, aa=$('#rAA').value, cr=+$('#rCr').value, xr=ui.recX?+$('#rXR').value:0;
  if(!ad&&!aa&&!cr&&!xr) return alert('いずれか1つ以上入力してください');
  const d={date,busId:b.id,leg:b.leg,actDep:ad,actArr:aa,dd:dlt(ad,b.dep),da:dlt(aa,b.arr),crowd:cr,xBusId:xr?$('#rXB').value:'',xRes:xr};

$('#rDel').onclick=()=>{if(confirm('この日の記録を削除しますか？')){S.recs=S.recs.filter(r=>!(r.busId===ui.recBus&&r.date===$('#rDate').value));afterRec()}};

/* 便の詳細（グラフ） */
function delayChart(rs){
  const d=rs.filter(r=>r.dd!=null||r.da!=null).slice(-14); if(!d.length) return '';
  const m=Math.max(3,...d.flatMap(r=>[Math.abs(r.dd||0),Math.abs(r.da||0)]));
  const W=320,H=140,z=70,k=52/m,st=(W-20)/d.length,bw=Math.min(12,st/2.6);
  let s=`<div class="route" style="margin-top:10px">遅れ（分）　<span style="color:var(--pri)">■発車</span> <span style="color:#f59e0b">■到着</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block"><line x1="10" x2="${W-10}" y1="${z}" y2="${z}" stroke="var(--line)"/>`;
  d.forEach((r,i)=>{
    const cx=10+st*i+st/2;
    [[r.dd,-bw,'var(--pri)'],[r.da,0,'#f59e0b']].forEach(([v,o,c])=>{
      if(v==null) return; const h=Math.abs(v)*k||1;
      s+=`<rect x="${cx+o}" y="${v>=0?z-h:z}" width="${bw}" height="${h}" fill="${c}" rx="2"/><text x="${cx+o+bw/2}" y="${v>=0?z-h-2:z+h+9}" font-size="8" text-anchor="middle" fill="var(--sub)">${sd(v)}</text>`;
    });
    s+=`<text x="${cx}" y="${H-4}" font-size="9" text-anchor="middle" fill="var(--sub)">${d.length<=8?r.date.slice(5).replace('-','/'):r.date.slice(8)}</text>`;
  });
  return s+'</svg>';
}
function distBlock(t,rows){
  const mx=Math.max(...rows.map(r=>r[1])); if(!mx) return '';
  return `<div class="route" style="margin-top:12px">${t}</div>`+rows.map(([l,n,c])=>`<div class="dist"><span class="lb">${l}</span><span class="br"><i style="width:${n/mx*100}%;background:${c}"></i></span><span class="n">${n}</span></div>`).join('');
}
function openDet(id){
  const b=S.buses.find(x=>x.id===id); if(!b) return; ui.det=id;
  const L=LEGS[b.leg], rs=recsOf(id);
  $('#dT').textContent=L.n+' '+fT(b.dep)+(b.arr?' → '+fT(b.arr):'');
  let h=`<div class="route">${L.f} → ${L.t}${+b.crowd>0?'　混雑予想：'+CROWD[b.crowd]:''}${b.note?'　'+esc(b.note):''}</div>`;
  if(!rs.length) h+='<div class="empty">まだ記録がありません。<br>「記録する」から少しずつ入力できます。</div>';
  else{
    const avg=k=>{const v=rs.map(r=>r[k]).filter(v=>v!=null);return v.length?v.reduce((a,c)=>a+c,0)/v.length:null};
    const sg=v=>v===null?'--':(v>0?'＋':'')+v.toFixed(1)+'分';
    h+=`<div class="card" style="margin:0 0 8px"><b>${rs.length}件</b>の記録<br>平均の遅れ　発車 ${sg(avg('dd'))}　到着 ${sg(avg('da'))}</div>`;
    h+=delayChart(rs);
    h+=distBlock('混雑状況',[1,2,3,4].map(i=>[CROWD[i],rs.filter(r=>r.crowd===i).length,CCOL[i]]));
    if(NEXT[b.leg]){
      const xs=rs.filter(r=>r.xRes>0), ok=xs.filter(r=>r.xRes<=2).length;
      h+=distBlock('乗り継ぎ結果'+(xs.length?`（成功率 ${Math.round(ok/xs.length*100)}%）`:''),[1,2,3,4].map(i=>[XRES_S[i],xs.filter(r=>r.xRes===i).length,XCOL[i]]));
    }
    h+='<div class="route" style="margin-top:14px">記録一覧（タップで編集）</div>'+rs.slice().reverse().slice(0,10).map(r=>`<div class="xfr" data-rd="${r.date}">${r.date.slice(5).replace('-','/')}　発${r.actDep?fT(r.actDep)+'('+sd(r.dd)+')':'--'} 着${r.actArr?fT(r.actArr)+'('+sd(r.da)+')':'--'}${r.crowd?`　<span class="cr c${r.crowd}">${CROWD[r.crowd]}</span>`:''}${r.xRes?`　<span class="${r.xRes<=2?'okm':'ngm'}">${XRES_S[r.xRes]}</span>`:''}</div>`).join('');
  }
  $('#dBody').innerHTML=h; open('#mDet');
}
$('#dBody').onclick=e=>{const r=e.target.closest('[data-rd]');if(r){close();openRec(ui.det,r.dataset.rd,true)}};
$('#dRec').onclick=()=>{close();openRec(ui.det,null,true)};
$('#dEdit').onclick=()=>{close();openBus(ui.det)};

function openBus(id,keep){
  ui.editBus=id; const L=LEGS[ui.leg], b=S.buses.find(x=>x.id===id)||{dep:'',arr:'',crowd:0,note:''};
  $('#mBusT').textContent=L.n+(id?'の便を編集':'の便を登録');

  $('#bDep').value=b.dep; $('#bArr').value=b.arr; $('#bCrowd').value=b.crowd||0; $('#bNote').value=b.note||'';
  $('#bDel').style.display=id?'':'none'; $('#bAgainRow').style.display=id?'none':'';
  open('#mBus');
}
function saveBus(again){
  const dep=$('#bDep').value; if(!dep) return alert('発車時刻を入力してください');
  const d={dep,arr:$('#bArr').value,crowd:+$('#bCrowd').value,note:$('#bNote').value.trim()};
  if(ui.editBus)Object.assign(S.buses.find(x=>x.id===ui.editBus),d); else S.buses.push({id:uid(),leg:ui.leg,...d});

  if(again){openBus(null);$('#bDep').focus()} else close();

$('#bSave').onclick=()=>saveBus(false);
$('#bSave2').onclick=()=>saveBus(true);
$('#bDel').onclick=()=>{if(confirm('この便と記録を削除しますか？')){S.buses=S.buses.filter(x=>x.id!==ui.editBus);S.recs=S.recs.filter(r=>r.busId!==ui.editBus);save();close();renderBus(false)}};

/* ---------- 便の比較 ---------- */
const fM=m=>{m=Math.round(m);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')};
function bstats(b){
  const rs=recsOf(b.id), avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const rides=rs.filter(r=>r.actDep&&r.actArr).map(r=>toMin(r.actArr)-toMin(r.actDep)).filter(v=>v>0);
  const da=avg(rs.map(r=>r.da).filter(v=>v!=null));
  const cr=rs.map(r=>r.crowd).filter(v=>v>0), xs=rs.filter(r=>r.xRes>0);
  const sched=(b.arr&&toMin(b.dep)!==null)?toMin(b.arr)-toMin(b.dep):null, ride=avg(rides);
  return {n:rs.length,ride:ride!=null?ride:sched,rideReal:ride!=null,da,
    arrE:b.arr?toMin(b.arr)+(da||0):null,
    crowd:cr.length?avg(cr):(+b.crowd>0?+b.crowd:null),crowdReal:cr.length>0,cn:cr.length,
    xn:xs.length,xok:xs.length?xs.filter(r=>r.xRes<=2).length/xs.length:null};
}
function renderCmp(){
  ui.cmpLeg=ui.cmpLeg||ui.leg||(new Date().getHours()<12?'o1':'r1');
  $$('#cmpSeg button').forEach(x=>x.classList.toggle('on',x.dataset.l===ui.cmpLeg));
  const now=new Date(), nm=now.getHours()*60+now.getMinutes(), up=$('#cmpUp').checked, L=LEGS[ui.cmpLeg], tx=!!NEXT[ui.cmpLeg];
  let list=byDep(S.buses.filter(b=>b.leg===ui.cmpLeg)); if(up) list=list.filter(b=>toMin(b.dep)>=nm);
  const head=`<div class="route"><b>${L.f}</b> → <b>${L.t}</b></div>`;
  if(!list.length){ $('#cmpBody').innerHTML=head+'<div class="empty">'+(up?'これから乗れる便がありません。<br>「これから乗れる便のみ」を外すと全便を比較できます。':'便が未登録です。')+'</div>'; return }
  const rows=list.map(b=>({b,s:bstats(b)}));
  const minBy=(k,arr=rows)=>{const v=arr.filter(r=>r.s[k]!=null);return v.length?v.reduce((a,c)=>c.s[k]<a.s[k]?c:a):null};
  const early=minBy('arrE'), seat=minBy('crowd'), fast=minBy('ride',rows.some(r=>r.s.rideReal)?rows.filter(r=>r.s.rideReal):rows);
  const xr=rows.filter(r=>r.s.xok!=null), xf=xr.length?xr.reduce((a,c)=>(c.s.xok>a.s.xok||(c.s.xok===a.s.xok&&c.s.xn>a.s.xn))?c:a):null;
  const pick=(ic,t,v)=>`<div class="pick"><span class="ic2">${ic}</span><div><b>${t}</b><div class="v">${v||'<small>データなし</small>'}</div></div></div>`;
  let h=head;
  h+=pick('⏱','早く着きたい',early&&`${fT(early.b.dep)}発 <small>→ ${fM(early.s.arrE)}着の目安${early.s.da!=null?'':'（定刻）'}</small>`);
  h+=pick('💺','座りたい',seat&&`${fT(seat.b.dep)}発 <small>${CROWD[Math.round(seat.s.crowd)]}${seat.s.crowdReal?'（記録'+seat.s.cn+'件）':'（予想）'}</small>`);
  if(tx) h+=pick('🔁','乗り換え確実',xf&&`${fT(xf.b.dep)}発 <small>成功率${Math.round(xf.s.xok*100)}%（${xf.s.xn}件）</small>`);
  const cls=tx?'g5':'g4', best=(r,x)=>x&&x.b.id===r.b.id?' best':'';
  h+=`<div class="route" style="margin-top:14px">全便の比較（タップで詳細）</div><div class="cmpr hd ${cls}"><span>発車</span><span>乗車</span><span>到着目安</span><span>混雑</span>${tx?'<span>乗継</span>':''}</div>`;
  rows.forEach(r=>{
    const {b,s}=r, ci=s.crowd!=null?Math.round(s.crowd):0;
    h+=`<div class="cmpr ${cls} ${toMin(b.dep)<nm?'past':''}" data-id="${b.id}">`
     +`<span><b>${fT(b.dep)}</b><small>${s.n?s.n+'件':'記録なし'}</small></span>`
     +`<span class="${s.rideReal?'':'est'}${best(r,fast)}">${s.ride!=null?(s.rideReal?'':'~')+Math.round(s.ride)+'分':'--'}</span>`
     +`<span class="${best(r,early).trim()}">${s.arrE!=null?fM(s.arrE)+(s.da!=null?`<small>(${sd(Math.round(s.da))})</small>`:''):'--'}</span>`
     +`<span class="${best(r,seat).trim()}">${ci?`<span class="cr c${ci}" ${s.crowdReal?'':'style="opacity:.55"'}>${s.crowdReal?'':'予 '}${CROWD[ci]}</span>`:'--'}</span>`
     +(tx?`<span class="${best(r,xf).trim()}">${s.xok!=null?Math.round(s.xok*100)+'%<small>('+s.xn+'件)</small>':'--'}</span>`:'')
     +'</div>';
  });
  h+='<div style="margin-top:8px"><small>乗車・到着は記録の平均（~は定刻、予は予想）。緑は各項目でいちばん良い便。記録が少ないうちは目安です。乗継は、その便の記録に基づく成功率です。</small></div>';
  $('#cmpBody').innerHTML=h;
}
$('#cmpSeg').onclick=e=>{const b=e.target.closest('button');if(b){ui.cmpLeg=b.dataset.l;renderCmp()}};
$('#cmpUp').onchange=renderCmp;
$('#cmpBody').onclick=e=>{const r=e.target.closest('[data-id]');if(r)openDet(r.dataset.id)};

/* ---------- やることリスト ---------- */
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function renderTodo(){
  const show=$('#showDone').checked, td=todayStr();
  let list=S.todos.filter(t=>show||!t.done);
  $('#todoList').innerHTML=list.length?list.map(t=>{
    const over=t.due&&!t.done&&t.due<td;
    return `<div class="card todo ${t.done?'done':''}" data-id="${t.id}">
      <span class="pri p${t.pri}">${t.pri}</span>
      <div class="bd"><div class="t">${esc(t.title)}</div>
       <div class="meta">${t.cat?`<span>🏷 ${esc(t.cat)}</span>`:''}<span class="${over?'over':''}">${t.due?'📅 '+t.due.slice(5).replace('-','/')+(over?'（期限切れ）':''):'期限なし'}</span></div>
       ${t.body?`<div class="meta">${esc(t.body).slice(0,60)}</div>`:''}</div>
      <button class="ic ok" data-ok="${t.id}">${t.done?'↩':'✓'}</button>
      <button class="ic" data-ed="${t.id}">✎</button></div>`}).join(''):'<div class="empty">タスクはありません。<br>右下の「＋」で追加できます。</div>';
  $('#catList').innerHTML=[...new Set(S.todos.map(t=>t.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('');
}
$('#todoList').onclick=e=>{
  const ok=e.target.closest('[data-ok]'), ed=e.target.closest('[data-ed]');
  if(ok){const t=S.todos.find(x=>x.id===ok.dataset.ok);t.done=!t.done;save();renderTodo()}
  if(ed) openTodo(ed.dataset.ed);
};
$('#showDone').onchange=renderTodo;
function setPri(p){ui.pri=p;$$('#priSeg button').forEach(b=>b.classList.toggle('on',b.dataset.p===p))}
$$('#priSeg button').forEach(b=>b.onclick=()=>setPri(b.dataset.p));
$('#tDue').oninput=()=>{$('#tNoDue').checked=!$('#tDue').value};
$('#tNoDue').onchange=()=>{if($('#tNoDue').checked)$('#tDue').value=''};
function openTodo(id){
  ui.editTodo=id; const t=S.todos.find(x=>x.id===id)||{title:'',pri:'B',cat:'',body:'',due:''};
  $('#mTodoT').textContent=id?'タスクを編集':'新規タスク';
  $('#tTitle').value=t.title;$('#tCat').value=t.cat;$('#tBody').value=t.body;$('#tDue').value=t.due||'';$('#tNoDue').checked=!t.due;
  setPri(t.pri);$('#tDel').style.display=id?'':'none';open('#mTodo');
}
$('#fab').onclick=()=>$('#tab-bus').classList.contains('on')?openBus(null):openTodo(null);
$('#tSave').onclick=()=>{
  const title=$('#tTitle').value.trim(); if(!title) return alert('タイトルを入力してください');
  const d={title,pri:ui.pri,cat:$('#tCat').value.trim(),body:$('#tBody').value,due:$('#tNoDue').checked?'':$('#tDue').value};
  if(ui.editTodo)Object.assign(S.todos.find(x=>x.id===ui.editTodo),d); else S.todos.push({id:uid(),done:false,...d});
  save();close();renderTodo();
};
$('#tDel').onclick=()=>{if(confirm('削除しますか？')){S.todos=S.todos.filter(x=>x.id!==ui.editTodo);save();close();renderTodo()}};

/* ---------- 並べ替え（長押しドラッグ／期限順） ---------- */
$('#sortBtn').onclick=()=>{
  if(!confirm('期限→重要度の順に並べ替えます（手動の並びは上書きされます）。よろしいですか？'))return;
  const k=t=>t.due||'9999';
  S.todos.sort((a,b)=>(a.done-b.done)||(k(a)>k(b)?1:k(a)<k(b)?-1:0)||(a.pri>b.pri?1:a.pri<b.pri?-1:0));
  save();renderTodo();
};
let dr=null;
const list=$('#todoList');
list.addEventListener('contextmenu',e=>e.preventDefault());
list.addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  const card=e.target.closest('.todo'); if(!card)return;
  dr={card,x:e.clientX,y:e.clientY,active:false};
  dr.timer=setTimeout(()=>{dr.active=true;card.classList.add('drag');navigator.vibrate&&navigator.vibrate(20)},450);
});
document.addEventListener('pointermove',e=>{
  if(!dr)return;
  if(!dr.active){ if(Math.hypot(e.clientX-dr.x,e.clientY-dr.y)>8){clearTimeout(dr.timer);dr=null} return; }
  const c=dr.card, y=e.clientY, main=$('main');
  c.style.transform='none';
  const sibs=[...list.querySelectorAll('.todo')].filter(x=>x!==c);
  const before=sibs.find(x=>{const r=x.getBoundingClientRect();return y<r.top+r.height/2});
  before?list.insertBefore(c,before):list.appendChild(c);
  const r=c.getBoundingClientRect();
  c.style.transform=`translateY(${y-(r.top+r.height/2)}px)`;
  if(y<110)main.scrollTop-=10; else if(y>innerHeight-150)main.scrollTop+=10;
});
document.addEventListener('touchmove',e=>{if(dr&&dr.active)e.preventDefault()},{passive:false});
function endDrag(){
  if(!dr)return; clearTimeout(dr.timer);
  if(dr.active){
    dr.card.classList.remove('drag');dr.card.style.transform='';
    const ids=[...list.querySelectorAll('.todo')].map(x=>x.dataset.id);
    const slots=[];S.todos.forEach((t,i)=>{if(ids.includes(t.id))slots.push(i)});
    const map=Object.fromEntries(S.todos.map(t=>[t.id,t]));
    ids.forEach((id,k)=>S.todos[slots[k]]=map[id]);
    save();renderTodo();
  }
  dr=null;
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

/* ---------- 設定 ---------- */
$('#gear').onclick=()=>{$('#gasUrl').value=gas();$('#xfMin').value=XF();msg('');open('#mSet')};
$('#setSave').onclick=()=>{try{localStorage.setItem(URLKEY,$('#gasUrl').value.trim())}catch(e){}S.xfer=Math.max(0,parseInt($('#xfMin').value)||5);save();renderBus(false);msg('保存しました')};
$('#push').onclick=()=>{try{localStorage.setItem(URLKEY,$('#gasUrl').value.trim())}catch(e){}push()};
$('#pull').onclick=()=>{try{localStorage.setItem(URLKEY,$('#gasUrl').value.trim())}catch(e){}pull()};

/* ---------- 起動 ---------- */
function migrate(){
  if(!S.recs)S.recs=[];
  if(S.xfers&&S.xfers.length&&!S.recs.length){
    S.recs=S.xfers.map(x=>({id:uid(),ts:x.ts||0,date:x.date,busId:x.aId,leg:x.leg,actDep:'',actArr:x.actual||'',dd:null,da:null,crowd:0,xBusId:x.bId,xRes:x.ok?1:3}));
    S.xfers=[]; save();
  }
}
function renderAll(){migrate();renderBus();renderTodo()}
renderAll();
if(gas()) pull();
setInterval(()=>renderBus(false),30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderBus()});
</script>
