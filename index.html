<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マイダッシュボード</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--sub:#6b7280;--line:#e5e7eb;--pri:#2563eb;--red:#e11d48}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1c212b;--tx:#e8eaf0;--sub:#9aa3b2;--line:#2d3441;--pri:#60a5fa;--red:#fb7185}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-weight:700;font-size:18px}
header button{background:none;border:0;font-size:20px;color:var(--sub)}
main{flex:1;overflow-y:auto;padding:0 12px 90px;position:relative}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0;background:none;border:0;color:var(--sub);font-size:12px}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--pri);font-weight:700}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
select,input,textarea,button.btn{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px}
select,input[type=text],input[type=date],textarea{width:100%}
textarea{min-height:90px}
.btn{cursor:pointer}.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.d{color:var(--red)}
.seg{display:flex;margin:8px 0}
.seg button{flex:1;padding:8px;border:1px solid var(--line);background:var(--card);color:var(--sub)}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.empty{color:var(--sub);text-align:center;padding:30px 10px;line-height:1.7}
.todo{display:flex;align-items:center;gap:8px}
.todo .bd{flex:1;min-width:0}
.todo .t{font-weight:600;word-break:break-all}
.todo .meta{font-size:12px;color:var(--sub);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.todo.done .t{text-decoration:line-through;color:var(--sub)}
.todo{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.todo.drag{position:relative;z-index:5;box-shadow:0 8px 20px #0005;opacity:.95;border-color:var(--pri)}
.pri{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;color:#fff;font-size:12px;font-weight:700}
.pA{background:#e11d48}.pB{background:#f59e0b}.pC{background:#64748b}
.over{color:var(--red);font-weight:700}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:16px;color:var(--tx)}
.ic.ok{color:#16a34a}
#fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 4px 12px #0004;touch-action:none}
.mask{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:10}
.mask.on{display:flex}
.modal{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 10px}
.modal label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
.modal .acts{display:flex;gap:8px;margin-top:16px}.modal .acts .btn{flex:1}
small{color:var(--sub)}
.route{font-size:14px;color:var(--sub);margin:4px 0 8px}.route b{color:var(--tx)}
.xfr{font-size:13px;padding:7px 4px;border-bottom:1px solid var(--line)}
.rb{padding:4px 10px;font-size:12px;flex:none}
body[data-tab=set] #fab{display:none}
body[data-tab=meal] header{display:none}
.ic.sm{width:30px;height:30px;font-size:14px;padding:0}
.dsel.sm{padding:4px 12px;font-size:14px;border-radius:7px}
.set label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
.set .acts{display:flex;gap:8px;margin-top:12px}.set .acts .btn{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.macro{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;margin-top:12px}
.macro b{display:block;font-size:16px}.macro small{font-size:10px}
.mh{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px}
.meal{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.meal .k{text-align:right;white-space:nowrap;font-weight:700}.meal small{display:block}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.th{position:relative;width:60px;height:60px}.th img{width:100%;height:100%;object-fit:cover;border-radius:8px}.th button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:12px;line-height:20px;padding:0}
.nb{margin-top:10px}.nh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}.nh small{color:var(--sub);font-size:11px}
.pb2{position:relative;height:14px;background:var(--bg);border-radius:7px;overflow:hidden}.pb2 i{position:absolute;top:0;bottom:0}.pb2 u{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);opacity:.75}
.stk{position:sticky;top:0;z-index:4;background:var(--bg);padding:10px 0 8px}.stk .card{margin-bottom:0}
.dsel{position:relative;display:inline-block;padding:9px 16px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-weight:700}
.dsel input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.nb,[data-nut]{cursor:pointer}
#mList .card{padding:6px 12px 4px;margin-bottom:6px}
#mList .mh{font-size:12px;margin-bottom:0;padding-bottom:3px}
#mList .meal{font-size:12px;padding:4px 0;gap:8px;line-height:1.35}
#mList .meal .k{font-size:12px}
#mList .meal small{font-size:11px}
.mh{font-size:13px}
.meal{font-size:13px;padding:7px 0;align-items:flex-start}
.meal:last-child{padding-bottom:0}
.meal .k{font-weight:400}
.pfw{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.pf{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--tx)}
.pf i{width:16px;height:16px;border-radius:50%;color:#fff;font-style:normal;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.nb2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin-top:10px}.nb2 .nh{margin-bottom:3px}.ns{text-align:right;font-size:11px;margin-top:3px;min-height:14px}
*{touch-action:manipulation}
html,body{overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;height:auto}
main{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;min-height:0}
body[data-tab=meal] main{overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
body[data-tab=meal] #tab-meal.on{display:flex;flex-direction:column;flex:1;min-height:0}
.stk{position:static;flex:none}
#mScroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:0}
#mScroll>.card:last-child{margin-bottom:0}
.cw{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.cw svg{display:block}.cw [data-day]{cursor:pointer}

.gcard{padding:12px}
.gh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.gtt{font-weight:700;font-size:15px;word-break:break-all}
.gbt{display:flex;gap:6px;align-items:center;flex:none}
.gbt .btn{padding:5px 12px;font-size:13px;border-radius:16px}
.gm{font-size:12px;color:var(--sub);margin-top:4px}
.gd{font-size:12px;color:var(--sub);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.gt{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,30px);gap:4px 3px;align-items:center;margin-top:10px}
.gt .dh{text-align:center;font-size:10px;line-height:1.25;padding-bottom:2px}
.gt .dh.today{font-weight:700;border-bottom:2px solid var(--pri)}
.gt .an{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.cell{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);margin:auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;background:transparent;padding:0}
.cell.on{background:#16a34a;border-color:#16a34a}.cell.td:not(.on){border-color:var(--pri)}.cell.fut{opacity:.3}
#gArc summary{font-weight:700;cursor:pointer}
.mh{display:grid;grid-template-columns:32px repeat(3,max-content) 1fr;align-items:center;column-gap:14px}
.mh .mk{text-align:right}
.mh .pf{display:flex;align-items:center;gap:4px;font-size:12px}
.mh .pf b{font-weight:400;flex:none;width:4.6ch;text-align:right;font-variant-numeric:tabular-nums}
#mHist{padding:3px 10px;font-size:12px;line-height:1.4;border-radius:12px}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.hrow:active{background:var(--bg)}.hn{min-width:0;word-break:break-all}.hk{white-space:nowrap;color:var(--sub)}
</style>
</head>
<body data-tab="goal">
<header><span id="ttl">🎯 目標管理</span></header>
<main>
 <section class="tab on" id="tab-goal">
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
   <button class="ic sm" id="gwPrev">‹</button>
   <div id="gwTxt0" style="text-align:center;cursor:pointer"><b id="gwTxt"></b><div><small id="gwSub"></small></div></div>
   <button class="ic sm" id="gwNext">›</button>
  </div>
  <div id="gList"></div>
  <details id="gArc" class="card"><summary></summary><div id="gArcList" style="margin-top:8px"></div></details>
 </section>
 <section class="tab" id="tab-meal">
  <div class="stk"><div class="card">
   <div class="row" style="justify-content:space-between"><button class="ic sm" id="mPrev">‹</button><div class="row" style="gap:6px"><label class="dsel sm"><span id="mDateTxt"></span><input type="date" id="mDate"></label><button class="btn rb" id="mToday">今日</button></div><button class="ic sm" id="mNext">›</button></div>
   <div id="mTotal"></div>
  </div></div>
  <div id="mScroll"><div id="mList"></div>
  <div class="card"><div class="route">カロリー推移</div><div class="cw" id="mCW"><div id="mChart"></div></div></div></div>
 </section>
 <section class="tab" id="tab-todo">
  <div id="todoList"></div>
  <div class="row" style="justify-content:center;gap:16px"><label class="row"><input type="checkbox" id="showDone"><small>完了済みも表示</small></label><button class="btn" id="sortBtn"><small>期限順に並べ替え</small></button></div><div style="text-align:center"><small>カードを長押しして上下にドラッグで並べ替え</small></div>
 </section>
 <section class="tab set" id="tab-set">
  <div class="card">
   <div class="route"><b>データ同期（Googleスプレッドシート）</b></div>
   <small>Apps ScriptのウェブアプリURLを入れると、変更のたびに自動保存し、起動時に読み込みます。食事のAI解析にも使います。空欄なら、この端末内のみに保存します。</small>
   <label>Apps Script URL</label><input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec">
   <div id="syncMsg" style="margin-top:6px"><small></small></div>
   <div class="acts"><button class="btn" id="pull">読込</button><button class="btn" id="push">送信</button></div>
  </div>
  <div class="card">
   <div class="route"><b>食事</b></div>
   <label>1日の栄養目標（空欄なら目標なし）</label>
   <div class="g2">
    <div><label>カロリー kcal（以内）</label><input type="text" inputmode="decimal" id="gKcal"></div>
    <div><label>たんぱく質 g（以上）</label><input type="text" inputmode="decimal" id="gP"></div>
    <div><label>脂質 g（以内）</label><input type="text" inputmode="decimal" id="gF"></div>
    <div><label>炭水化物 g（以内）</label><input type="text" inputmode="decimal" id="gC"></div>
    <div><label>食物繊維 g（以上）</label><input type="text" inputmode="decimal" id="gFib"></div>
    <div><label>塩分 g（以内）</label><input type="text" inputmode="decimal" id="gSalt"></div>
   </div>
   <button class="btn" id="gReset" style="width:100%;margin-top:10px">おすすめ値に戻す</button>
  </div>
  <div style="text-align:center"><small>変更は自動で保存されます。</small></div>
 </section>
</main>
<button id="fab">＋</button>
<nav>
 <button data-t="goal" class="on"><span>🎯</span>目標</button>
 <button data-t="meal"><span>🍽</span>食事</button>
 <button data-t="todo"><span>✅</span>やること</button>

</nav>

<!-- 目標モーダル -->

 <h3 id="gmT">目標を登録</h3>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* iOSのゴム紐スクロール（端での引っ張り）を防ぐ（横スワイプは邪魔しない） */
let _ty=0,_tx=0;
document.addEventListener('touchstart',e=>{_ty=e.touches[0].clientY;_tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchmove',e=>{
  const dx=e.touches[0].clientX-_tx, dy=e.touches[0].clientY-_ty;
  if(Math.abs(dx)>Math.abs(dy)) return;
  let el=e.target;
  while(el&&el!==document.body&&el!==document.documentElement){
    if(el.scrollHeight>el.clientHeight+1&&/(auto|scroll)/.test(getComputedStyle(el).overflowY)) break;
    el=el.parentElement;
  }
  if(!el||el===document.body||el===document.documentElement){e.preventDefault();return}
  const top=el.scrollTop<=0, bot=el.scrollTop+el.clientHeight>=el.scrollHeight-1;
  if((top&&dy>0)||(bot&&dy<0)) e.preventDefault();
},{passive:false});
const uid=()=>Math.random().toString(36).slice(2,10);
const KEY='myDash.v1', URLKEY='myDash.gas';
let S={meals:[],gl:[],chk:{},todos:[]}, ui={pri:'B',editTodo:null};

/* ---------- 保存・同期 ---------- */
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
const gas=()=>{try{return localStorage.getItem(URLKEY)||''}catch(e){return ''}};
let tmr;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(tmr); if(gas()) tmr=setTimeout(push,800);
}
async function push(){
  if(!gas()) return msg('URL未設定');
  try{await fetch(gas(),{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(S)});msg('送信しました '+new Date().toLocaleTimeString())}
  catch(e){msg('送信失敗: '+e.message)}
}
async function pull(){
  if(!gas()) return msg('URL未設定');
  try{const r=await fetch(gas()); const d=await r.json();
    if(d&&(d.stops||d.todos||d.meals||d.gl)){S=Object.assign({meals:[],gl:[],chk:{},todos:[]},d);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}renderAll();msg('読み込みました')}
    else msg('シートにデータがありません');
  }catch(e){msg('読込失敗: '+e.message)}
}
const msg=t=>$('#syncMsg').innerHTML='<small>'+esc(t)+'</small>';

/* ---------- 共通UI ---------- */
const open=id=>$(id).classList.add('on'), close=()=>$$('.mask').forEach(m=>m.classList.remove('on'));

/* ---------- 目標管理 ---------- */
const G_MAX=5;
const mondayOf=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return fmtD(d)};
const chkHas=(aid,d)=>(S.chk[aid]||[]).includes(d);
const ymd=d=>d.replace(/-/g,'/');
function dueTxt(g){
  if(!g.due) return '期限なし';
  const n=Math.round((new Date(g.due+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5);
  if(n<0) return `<b style="color:var(--red)">期限 ${ymd(g.due)}（${-n}日超過）</b>`;
  if(n===0) return `<b style="color:var(--red)">期限 ${ymd(g.due)}（今日）</b>`;
  return `<span ${n<=7?'style="color:#ea580c;font-weight:700"':''}>期限 ${ymd(g.due)}（あと${n}日）</span>`;
}
function streak(g){
  if(!g.acts.length) return 0;
  const all=x=>g.acts.every(a=>chkHas(a.id,x));
  let d=todayStr(), n=0; if(!all(d)) d=addD(d,-1);
  while(n<3650&&d>=(g.created||'0000')&&all(d)){n++;d=addD(d,-1)}
  return n;
}
function renderGoal(){
  const td=todayStr(); ui.gw=ui.gw||mondayOf(td);
  const days=[...Array(7)].map((_,i)=>addD(ui.gw,i)), act=S.gl.filter(g=>!g.done), arc=S.gl.filter(g=>g.done);
  const f=d=>d.slice(5).replace('-','/');
  $('#gwTxt').textContent=f(days[0])+' 〜 '+f(days[6])+(ui.gw===mondayOf(td)?'（今週）':'');
  $('#gwSub').textContent=`進行中の目標 ${act.length}/${G_MAX}`;
  const head=days.map(d=>{
    const [y,m,dd]=d.split('-').map(Number), w=new Date(y,m-1,dd).getDay(), h=holSet(y).has(m*100+dd);
    const c=(w===0||h)?'var(--red)':w===6?'var(--pri)':'var(--sub)';
    return `<div class="dh ${d===td?'today':''}" style="color:${c}">${'日月火水木金土'[w]}<br>${dd}</div>`;
  }).join('');
  const rows=g=>g.acts.map(a=>`<div class="an">${esc(a.name)}</div>`+days.map(d=>{
    const on=chkHas(a.id,d);
    return `<button class="cell ${on?'on':''} ${d>td?'fut':''} ${d===td?'td':''}" data-a="${a.id}" data-d="${d}" ${d>td?'disabled':''}>${on?'✓':''}</button>`;
  }).join('')).join('');
  $('#gList').innerHTML=act.length?act.map(g=>{
    const past=days.filter(d=>d<=td), poss=g.acts.length*past.length, done=g.acts.reduce((n,a)=>n+past.filter(d=>chkHas(a.id,d)).length,0), st=streak(g);
    return `<div class="card gcard"><div class="gh"><div class="gtt">${esc(g.title)}</div><div class="gbt"><button class="btn p rb" data-gok="${g.id}">達成</button><button class="ic sm" data-ged="${g.id}">✎</button></div></div>`
      +`<div class="gm">${dueTxt(g)}${poss?`　今週 ${Math.round(done/poss*100)}%（${done}/${poss}）`:''}${st?`　連続 ${st}日`:''}</div>`
      +(g.detail?`<div class="gd">${esc(g.detail)}</div>`:'')
      +(g.acts.length?`<div class="gt"><div></div>${head}${rows(g)}</div>`:'<div class="gd">毎日の行動が未登録です。右上の✎から追加できます。</div>')+'</div>';
  }).join(''):'<div class="empty">目標がまだありません。<br>右下の「＋」から、最初の目標を登録しましょう。<br><small>同時に進められるのは、最大'+G_MAX+'つです。</small></div>';
  $('#gArc summary').textContent=`アーカイブ（${arc.length}）`;
  $('#gArcList').innerHTML=arc.length?arc.slice().sort((a,b)=>(b.doneDate||'')>(a.doneDate||'')?1:-1).map(g=>
    `<div class="xfr"><div class="row" style="justify-content:space-between"><div><b>${esc(g.title)}</b><div><small>達成 ${ymd(g.doneDate||'')}${g.due?'　期限 '+ymd(g.due):''}</small></div></div><div class="row"><button class="ic sm" data-grs="${g.id}">↩</button><button class="ic sm" data-gdl="${g.id}">🗑</button></div></div></div>`).join('')
    :'<div class="empty" style="padding:14px">達成した目標が、ここに保存されます。</div>';
}

  const ok=e.target.closest('[data-gok]'), ed=e.target.closest('[data-ged]'), rs=e.target.closest('[data-grs]'), dl=e.target.closest('[data-gdl]');

  if(dl) delGoal(dl.dataset.gdl);

function delGoal(id){
  const g=S.gl.find(x=>x.id===id); if(!g||!confirm('「'+g.title+'」と、その記録を削除しますか？')) return false;
  g.acts.forEach(a=>delete S.chk[a.id]); S.gl=S.gl.filter(x=>x.id!==id); save(); close(); renderGoal(); return true;
}

/* ---------- 並べ替え（長押しドラッグ／期限順） ---------- */
$('#sortBtn').onclick=()=>{
  if(!confirm('期限→重要度の順に並べ替えます（手動の並びは上書きされます）。よろしいですか？'))return;
  const k=t=>t.due||'9999';
  S.todos.sort((a,b)=>(a.done-b.done)||(k(a)>k(b)?1:k(a)<k(b)?-1:0)||(a.pri>b.pri?1:a.pri<b.pri?-1:0));
  save();renderTodo();
};
let dr=null;
const list=$('#todoList');
list.addEventListener('contextmenu',e=>e.preventDefault());
list.addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  const card=e.target.closest('.todo'); if(!card)return;
  dr={card,x:e.clientX,y:e.clientY,active:false};
  dr.timer=setTimeout(()=>{dr.active=true;card.classList.add('drag');navigator.vibrate&&navigator.vibrate(20)},450);
});
document.addEventListener('pointermove',e=>{
  if(!dr)return;
  if(!dr.active){ if(Math.hypot(e.clientX-dr.x,e.clientY-dr.y)>8){clearTimeout(dr.timer);dr=null} return; }
  const c=dr.card, y=e.clientY, main=$('main');
  c.style.transform='none';
  const sibs=[...list.querySelectorAll('.todo')].filter(x=>x!==c);
  const before=sibs.find(x=>{const r=x.getBoundingClientRect();return y<r.top+r.height/2});
  before?list.insertBefore(c,before):list.appendChild(c);
  const r=c.getBoundingClientRect();
  c.style.transform=`translateY(${y-(r.top+r.height/2)}px)`;
  if(y<110)main.scrollTop-=10; else if(y>innerHeight-150)main.scrollTop+=10;
});
document.addEventListener('touchmove',e=>{if(dr&&dr.active)e.preventDefault()},{passive:false});
function endDrag(){
  if(!dr)return; clearTimeout(dr.timer);
  if(dr.active){
    dr.card.classList.remove('drag');dr.card.style.transform='';
    const ids=[...list.querySelectorAll('.todo')].map(x=>x.dataset.id);
    const slots=[];S.todos.forEach((t,i)=>{if(ids.includes(t.id))slots.push(i)});
    const map=Object.fromEntries(S.todos.map(t=>[t.id,t]));
    ids.forEach((id,k)=>S.todos[slots[k]]=map[id]);
    save();renderTodo();
  }
  dr=null;
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

const DEF_GOALS={kcal:1600,p:110,f:45,c:190,fiber:22,salt:7.5};
const G=()=>Object.assign({},DEF_GOALS,S.goals||{});
const GID={kcal:'gKcal',p:'gP',f:'gF',c:'gC',fiber:'gFib',salt:'gSalt'};
function fillGoals(g){g=g||G();Object.keys(GID).forEach(k=>$('#'+GID[k]).value=g[k]||'')}
function readGoals(){const g={};Object.keys(GID).forEach(k=>g[k]=num($('#'+GID[k]).value));S.goals=g}
const NUT=[['p','たんぱく質','min'],['f','脂質','max'],['c','炭水化物','max'],['fiber','食物繊維','min'],['salt','塩分','max']];
function barHtml(val,goal,type,sc,col){
  if(!goal) return '<div class="pb2"></div>';
  const pct=val/goal*100, tot=Math.max(sc||100,100), W=x=>x/tot*100;
  const seg=(a,b,c)=>b>a?`<i style="left:${W(a)}%;width:${W(b-a)}%;background:${c}"></i>`:'';
  let h='<div class="pb2">';
  if(type==='min') h+=seg(0,pct,col||(pct>=100?'#16a34a':'var(--pri)'));
  else h+=seg(0,Math.min(pct,100),col||'var(--pri)')+seg(100,Math.min(pct,120),'#f97316')+seg(120,pct,'#dc2626');
  return h+(tot>100?`<u style="left:calc(${W(100)}% - 1px)"></u>`:'')+'</div>';
}
function stText(val,goal,type,u){
  if(!goal) return '';
  const d=u==='kcal'?Math.round(val-goal):Math.round((val-goal)*10)/10;
  if(type==='max') return d>0?`<b style="color:${val>goal*1.2?'#dc2626':'#ea580c'}">＋${d} 超過</b>`:`<span style="color:var(--sub)">残り ${-d} ${u}</span>`;
  return d>=0?`<b style="color:#16a34a">達成</b>`:`<span style="color:var(--sub)">あと ${-d} ${u}</span>`;
}
function nutBar(label,val,goal,type,sc,col,key){
  return `<div class="nb" data-nut="${key}"><div class="nh"><span>${col?`<i class="dot" style="background:${col}"></i>`:''}${label}</span><span>${val}${goal?' / '+goal:''} g　${stText(val,goal,type,'g')}</span></div>${barHtml(val,goal,type,sc,BARCOL[key]||col)}</div>`;
}
function nutHalf(label,val,goal,type,sc,key){
  return `<div data-nut="${key}"><div class="nh"><span>${label}</span><span>${val}${goal?' / '+goal:''} g</span></div>${barHtml(val,goal,type,sc,BARCOL[key])}<div class="ns">${stText(val,goal,type,'g')}</div></div>`;
}
const NCOL={p:'#ef4444',f:'#eab308',c:'#22c55e'};
const BARCOL={p:'#ef4444',f:'#eab308',c:'#22c55e',fiber:'#9ca3af',salt:'#9ca3af'};
const NMETA={kcal:['カロリー','max','kcal'],p:['たんぱく質','min','g'],f:['脂質','max','g'],c:['炭水化物','max','g'],fiber:['食物繊維','min','g'],salt:['塩分','max','g']};

const fmtD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return fmtD(d)};
const num=v=>Math.round((parseFloat(v)||0)*10)/10;

/* 推移グラフ：今日から61日前（約2ヶ月）までを横スクロールで表示。画面には7日分ずつ */
const CH_DAYS=61;
function trendChart(key,type,col){
  const N=CH_DAYS, days=[...Array(N)].map((_,i)=>addD(todayStr(),i-N+1)), goal=G()[key]||0, own=!!BARCOL[key];
  const by={}; S.meals.forEach(m=>{(by[m.date]=by[m.date]||[]).push(m)});
  const v=days.map(d=>sum(by[d]||[],key)), mx=Math.max(goal*1.25,...v,1);
  const st=320/7, W=st*N, H=150, b=125, k=95/mx, fm=x=>String(Math.round(x*(key==='kcal'?1:10))/(key==='kcal'?1:10));
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:${N/7*100}%">`;
  v.forEach((x,i)=>{
    const cx=st*i+st/2, op=days[i]===ui.mDay?1:.6, h=x*k;
    const R=(y,hh,c)=>hh>0?`<rect x="${cx-13}" y="${y}" width="26" height="${hh}" rx="2" fill="${c}" opacity="${op}"/>`:'';
    let bars='', over='';
    if(type==='max'&&goal){
      const bh=Math.min(x,goal)*k, oh=Math.min(Math.max(x-goal,0),goal*.2)*k, rh=Math.max(x-goal*1.2,0)*k;
      bars=R(b-bh,bh,col)+R(b-bh-oh,oh,'#f97316')+R(b-bh-oh-rh,rh,'#dc2626');
      if(x>goal) over=`<text x="${cx}" y="${b-h-14}" font-size="9" font-weight="700" text-anchor="middle" fill="${x>goal*1.2?'#dc2626':'#ea580c'}">＋${fm(x-goal)}</text>`;
    } else bars=R(b-h,h,(type==='min'&&goal&&x>=goal&&!own)?'#16a34a':col);
    s+=bars+over+(x?`<text x="${cx}" y="${b-h-3}" font-size="9" text-anchor="middle" fill="var(--sub)">${fm(x)}</text>`:'')
      +`<text x="${cx}" y="${H-8}" font-size="${days[i]===ui.mDay?11:10}" ${days[i]===ui.mDay?'font-weight="700" ':''}text-anchor="middle" fill="${days[i]===ui.mDay?'var(--tx)':'var(--sub)'}">${days[i].slice(5).replace('-','/')}</text>`
      +`<rect data-day="${days[i]}" x="${st*i}" y="0" width="${st}" height="${H}" fill="transparent"/>`;
  });
  if(goal) s+=`<line x1="0" x2="${W}" y1="${b-goal*k}" y2="${b-goal*k}" stroke="var(--sub)" stroke-dasharray="4 3"/>`;
  return s+'</svg>';
}
function mealChart(){return trendChart('kcal','max','var(--pri)')}

function openNut(key){
  const [label,type,u]=NMETA[key], goal=G()[key]||0;

  $('#nBody').innerHTML=`<div class="route">${goal?'目標 '+goal+' '+u+(type==='min'?' 以上':' 以内'):'目標なし'}${rec.length?'　／　記録のある日の平均 '+(key==='kcal'?Math.round(avg):Math.round(avg*10)/10)+' '+u:''}</div><div class="cw">${trendChart(key,type,BARCOL[key]||'var(--pri)')}</div>`;

const nthMon=(y,m,n)=>1+(8-new Date(y,m,1).getDay())%7+7*(n-1);
function holSet(y){
  const H=new Set(), add=(m,d)=>H.add(m*100+d), key=dt=>(dt.getMonth()+1)*100+dt.getDate();
  const eq=a=>Math.floor(a+0.242194*(y-1980)-Math.floor((y-1980)/4));
  add(1,1);add(1,nthMon(y,0,2));add(2,11);if(y>=2020)add(2,23);add(3,eq(20.8431));add(4,29);add(5,3);add(5,4);add(5,5);
  add(7,nthMon(y,6,3));add(8,11);add(9,nthMon(y,8,3));add(9,eq(23.2488));add(10,nthMon(y,9,2));add(11,3);add(11,23);
  [...H].forEach(k=>{const dt=new Date(y,Math.floor(k/100)-1,k%100);if(dt.getDay()===0){const n=new Date(dt);do{n.setDate(n.getDate()+1)}while(H.has(key(n)));H.add(key(n))}});
  for(let m=1;m<=12;m++)for(let d=1;d<=31;d++){const dt=new Date(y,m-1,d);if(dt.getMonth()!==m-1||dt.getDay()===0||H.has(m*100+d))continue;
    if(H.has(key(new Date(y,m-1,d-1)))&&H.has(key(new Date(y,m-1,d+1))))H.add(m*100+d)}
  return H;
}
function renderDateTxt(day){
  const [y,m,d]=day.split('-').map(Number), w=new Date(y,m-1,d).getDay(), h=holSet(y).has(m*100+d), el=$('#mDateTxt');
  el.textContent=`${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}（${'日月火水木金土'[w]}）`;
  el.style.color=(w===0||h)?'var(--red)':w===6?'var(--pri)':'var(--tx)';
}
const pfT=(c,t,v)=>`<span class="pf"><i style="background:${c}">${t}</i><b>${(+v||0).toFixed(1)}</b></span>`;
function renderMeal(){
  const day=ui.mDay=ui.mDay||todayStr(); $('#mDate').value=day; renderDateTxt(day);
  const ms=S.meals.filter(m=>m.date===day), goal=G().kcal, k=sum(ms,'kcal'), g=G(), sc=Math.max(100,goal?k/goal*100:0,...NUT.map(([x])=>g[x]?sum(ms,x)/g[x]*100:0));
  $('#mTotal').innerHTML=`<div data-nut="kcal"><div style="margin:10px 0 6px"><span style="font-size:30px;font-weight:700">${Math.round(k).toLocaleString()}</span> kcal${goal?`　<small>目標 ${goal} kcal　</small>${stText(k,goal,'max','kcal')}`:''}</div>`
    +(goal?barHtml(k,goal,'max',sc):'')+'</div>'
    +NUT.filter(x=>NCOL[x[0]]).map(([k,l,t])=>nutBar(l,sum(ms,k),g[k],t,sc,NCOL[k],k)).join('')+'<div class="nb2">'+NUT.filter(x=>!NCOL[x[0]]).map(([k,l,t])=>nutHalf(l,sum(ms,k),g[k],t,sc,k)).join('')+'</div>';
  let h='';
  SLOTS.forEach(([key,label])=>{
    const l=ms.filter(m=>m.slot===key).sort((a,b)=>a.ts-b.ts); if(!l.length) return;
    h+=`<div class="card"><div class="mh"><span>${label}</span>${pfT('#ef4444','P',sum(l,'p'))}${pfT('#eab308','F',sum(l,'f'))}${pfT('#22c55e','C',sum(l,'c'))}<span class="mk">${Math.round(sum(l,'kcal'))} kcal</span></div>`
      +l.map(m=>`<div class="meal" data-mid="${m.id}"><div>${esc(m.name)}</div><div class="k">${Math.round(m.kcal)} kcal</div></div>`).join('')+'</div>';
  });
  $('#mList').innerHTML=h||'<div class="empty">この日の記録はありません。<br>右下の「＋」から、写真や栄養成分のスクショを登録できます。</div>';
  $('#mChart').innerHTML=mealChart();
  const w=$('#mCW'); if(!ui.chartInit&&w.scrollWidth>w.clientWidth){w.scrollLeft=w.scrollWidth;ui.chartInit=true}
}

$('#slotSeg').onclick=e=>{const b=e.target.closest('button');if(b){ui.slot=b.dataset.s;$$('#slotSeg button').forEach(x=>x.classList.toggle('on',x===b))}};
function openMeal(id){

  open('#mMeal');
}
function resizeImg(file,max=1400){return new Promise((res,rej)=>{
  const img=new Image(), u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.85).split(',')[1])};
  img.onerror=()=>rej(new Error('画像を読み込めませんでした'));img.src=u;
})}
function renderThumbs(){
  $('#mThumbs').innerHTML=ui.imgs.map((x,i)=>`<div class="th"><img src="${x.url}"><button data-rm="${i}">×</button></div>`).join('');
  const full=ui.imgs.length>=5; $('#mAdd').disabled=full;
  $('#mAdd').textContent=full?'画像は最大5枚です':'＋ 画像を追加（'+ui.imgs.length+'/5）';
}
$('#mAdd').onclick=()=>$('#mFile').click();

};

$('#mAnalyze').onclick=async()=>{
  const text=$('#mText').value.trim(), st=$('#mStatus'), btn=$('#mAnalyze');
  if(!text&&!ui.imgs.length) return alert('食事の内容（文章）か、画像のどちらかを入れてください');
  if(!gas()) return alert('⚙️でApps ScriptのURLを設定してください（AI解析に必要です）');
  st.innerHTML='<small>解析中…（10〜30秒かかることがあります）</small>'; btn.disabled=true;
  try{
    const mx=ui.imgs.length>2?1100:1400;
    const images=await Promise.all(ui.imgs.map(x=>resizeImg(x.file,mx)));
    const r=await fetch(gas(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({__analyze:true,text,images,mime:'image/jpeg'})});
    const raw=await r.text(); let d;
    try{d=JSON.parse(raw)}catch(e){throw new Error('サーバーの応答を読み取れませんでした: '+raw.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,160))}
    if(!d.ok) throw new Error(d.error||'解析に失敗しました');
    const x=d.result||{}; if(x.error) throw new Error(x.error);
    const v=n=>n?num(n):'';
    $('#mName').value=x.name||''; $('#mKcal').value=v(x.kcal); $('#mP').value=v(x.p); $('#mF').value=v(x.f); $('#mC').value=v(x.c); $('#mFib').value=v(x.fiber); $('#mSalt').value=v(x.salt);
    if(!$('#mNote').value.trim()&&text) $('#mNote').value=text.slice(0,300);
    ui.ai=true;
    st.innerHTML=`<small>${x.source==='label'?'表示の数値を読み取りました':'内容からの推定です'}（${esc(d.model)}）。${esc(x.note||'')}　内容は修正できます。</small>`;
  }catch(e){st.innerHTML=`<small style="color:var(--red)">${esc(e.message)}</small>`}
  btn.disabled=false;
};
/* 履歴から入力：空欄なら直近30件、文字を入れると過去の全履歴を名前で検索 */
const nrm=s=>String(s||'').normalize('NFKC').toLowerCase().trim();
function mealHistory(q){
  const seen=new Set(), out=[], lim=q?100:30;
  S.meals.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).forEach(m=>{
    if(out.length>=lim) return;
    if(q&&!nrm(m.name).includes(q)) return;
    const k=m.name+'|'+Math.round(m.kcal);
    if(!seen.has(k)){seen.add(k);out.push(m)}
  });
  return out;
}
function renderHist(){
  const q=nrm($('#hQ').value), l=mealHistory(q);
  $('#hSub').textContent=q?`（${l.length}件ヒット）`:'（直近30件）';
  $('#mHistList').innerHTML=l.length?l.map(m=>`<div class="hrow" data-hid="${m.id}"><span class="hn">${esc(m.name)}</span><span class="hk">${Math.round(m.kcal)} kcal</span></div>`).join(''):`<div class="empty">${q?'該当する履歴がありません。':'履歴がありません。'}</div>`;
}
$('#mHist').onclick=()=>{$('#hQ').value='';renderHist();open('#mHistM');$('#mHistM .modal').scrollTop=0};

  ui.ai=false; $('#mStatus').innerHTML='<small>履歴から入力しました。内容は修正できます。</small>';
  $('#mHistM').classList.remove('on');
};

$('#mSave').onclick=()=>{

/* ---------- ＋ボタンのドラッグ移動 ---------- */
let fabMoved=false, fd=null; const FABK='myDash.fab', fab=$('#fab');
function fabPlace(r,b){
  r=Math.min(Math.max(r,8),innerWidth-56-8); b=Math.min(Math.max(b,$('nav').offsetHeight+8),innerHeight-56-60);
  fab.style.right=r+'px'; fab.style.bottom=b+'px'; return [r,b];
}
try{const p=JSON.parse(localStorage.getItem(FABK)||'null'); if(p) fabPlace(p[0],p[1])}catch(e){}
addEventListener('resize',()=>{const c=fab.getBoundingClientRect(); if(c.width) fabPlace(innerWidth-c.right,innerHeight-c.bottom)});
fab.addEventListener('pointerdown',e=>{
  fabMoved=false; const c=fab.getBoundingClientRect();
  fd={x:e.clientX,y:e.clientY,r:innerWidth-c.right,b:innerHeight-c.bottom,on:false}; fab.setPointerCapture(e.pointerId);
});
fab.addEventListener('pointermove',e=>{
  if(!fd) return; const dx=e.clientX-fd.x, dy=e.clientY-fd.y;
  if(!fd.on&&Math.hypot(dx,dy)>8){fd.on=true;fabMoved=true}
  if(fd.on) fabPlace(fd.r-dx,fd.b-dy);
});
const fabEnd=()=>{
  if(fd&&fd.on){try{localStorage.setItem(FABK,JSON.stringify([parseFloat(fab.style.right),parseFloat(fab.style.bottom)]))}catch(e){}}
  fd=null;
};
fab.addEventListener('pointerup',fabEnd); fab.addEventListener('pointercancel',fabEnd);

/* ---------- 起動 ---------- */
function migrate(){
  if(!S.goals){S.goals=Object.assign({},DEF_GOALS);if(+S.goal>0)S.goals.kcal=+S.goal}
  if(!S.gl)S.gl=[]; if(!S.chk)S.chk={};
  if(!S.meals)S.meals=[]; if(!S.todos)S.todos=[];
  /* 旧バス機能のデータを完全に削除 */
  const old=['buses','xfers','recs','xfer','stops'].filter(k=>k in S);
  old.forEach(k=>delete S[k]);
  try{localStorage.removeItem('myDash.tt');localStorage.removeItem('myDash.ttDay')}catch(e){}
  if(old.length) save();
}
